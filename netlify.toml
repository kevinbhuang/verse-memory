[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Proxy Crossway ESV audio without exposing the API token to the browser.
# Must appear before the SPA fallback.
[[redirects]]
  from = "/api/esv-audio"
  to = "/.netlify/functions/esv-audio"
  status = 200
  force = true

[[redirects]]
  from = "/api/esv-text"
  to = "/.netlify/functions/esv-text"
  status = 200
  force = true

# Single-page application fallback. The service worker handles offline
# navigation once the app has been loaded at least once.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
